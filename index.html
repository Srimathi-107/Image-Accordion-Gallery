
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Image Accordion Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <span class="eyebrow">DISCOVER THE WORLD</span>
            <h1>Image <span>Accordion</span></h1>
            <p>Explore beautiful places, one image at a time.</p>
        </header>

        <section class="gallery-section">
            <div id="accordion"></div>

            <div class="controls">
                <button id="prev" aria-label="Previous image">
                    &#8592;
                </button>

                <div class="control-text">
                    <span>EXPLORE MORE</span>
                    <p>Choose your next destination</p>
                </div>

                <button id="next" aria-label="Next image">
                    &#8594;
                </button>
            </div>

            <div id="dots"></div>
        </section>

        <footer>
            <span>IMAGE GALLERY</span>
            <span>MADE WITH HTML · CSS · JAVASCRIPT</span>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
